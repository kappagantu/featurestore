[project]
name = "materialization-worker"
version = "0.1.0"
description = "Async worker for feature materialization jobs"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "deltalake>=0.18.2",
  "pyarrow>=17.0.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0"
]

[tool.setuptools]
packages = ["worker"]
