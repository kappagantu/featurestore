[project]
name = "feature-store-service"
version = "0.4.0"
description = "Offline/online feature store service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "boto3>=1.34.0",
  "deltalake>=0.18.2",
  "pyarrow>=17.0.0",
  "PyJWT[crypto]>=2.9.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0"
]

[tool.setuptools]
packages = ["app"]
