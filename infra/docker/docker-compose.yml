services:
  postgres:
    image: postgres:15
    container_name: fs-postgres
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:latest
    container_name: fs-localstack
    environment:
      SERVICES: s3,dynamodb
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack:/var/lib/localstack

  aws-init:
    image: amazon/aws-cli:2.15.57
    container_name: fs-aws-init
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      until aws --endpoint-url=http://localstack:4566 s3 ls >/dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url=http://localstack:4566 s3 mb s3://features-offline || true;
      aws --endpoint-url=http://localstack:4566 dynamodb create-table
      --table-name features_online
      --attribute-definitions AttributeName=pk,AttributeType=S
      --key-schema AttributeName=pk,KeyType=HASH
      --billing-mode PAY_PER_REQUEST || true;
      aws --endpoint-url=http://localstack:4566 dynamodb create-table
      --table-name materialization_jobs
      --attribute-definitions AttributeName=job_id,AttributeType=S
      --key-schema AttributeName=job_id,KeyType=HASH
      --billing-mode PAY_PER_REQUEST || true;
      "

  feature-group-service:
    build:
      context: ../../apps/feature-group-service
    container_name: fs-feature-group
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://fs:fs@postgres:5432/fs_meta
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_MODE: ${AUTH_MODE:-static}
      API_TOKENS: ${API_TOKENS:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/featurestore/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-featurestore-sdk}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    ports:
      - "8001:8001"

  feature-store-service:
    build:
      context: ../../apps/feature-store-service
    container_name: fs-feature-store
    depends_on:
      - aws-init
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      FEATURES_S3_BUCKET: features-offline
      FEATURES_DDB_TABLE: features_online
      MATERIALIZATION_JOBS_TABLE: materialization_jobs
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_MODE: ${AUTH_MODE:-static}
      API_TOKENS: ${API_TOKENS:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/featurestore/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-featurestore-sdk}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    ports:
      - "8002:8002"

  materialization-worker:
    build:
      context: ../../projects/materialization-worker
    container_name: fs-materialization-worker
    depends_on:
      - aws-init
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      FEATURES_S3_BUCKET: features-offline
      FEATURES_DDB_TABLE: features_online
      MATERIALIZATION_JOBS_TABLE: materialization_jobs
      WORKER_POLL_INTERVAL_SEC: 3
      WORKER_METRICS_PORT: 9101
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    ports:
      - "9101:9101"

  lineage-service:
    build:
      context: ../../apps/lineage-service
    container_name: fs-lineage
    depends_on:
      - marquez
    environment:
      MARQUEZ_URL: http://marquez:5000
      OPENLINEAGE_NAMESPACE: featurestore.local
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_MODE: ${AUTH_MODE:-static}
      API_TOKENS: ${API_TOKENS:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/featurestore/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-featurestore-sdk}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    ports:
      - "8003:8003"

  marquez:
    image: marquezproject/marquez:latest
    platform: linux/amd64
    container_name: fs-marquez
    environment:
      MARQUEZ_PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MARQUEZ_HOST_PORT:-5001}:5000"

  marquez-web:
    image: marquezproject/marquez-web:latest
    platform: linux/amd64
    container_name: fs-marquez-web
    environment:
      WEB_PORT: 3000
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    depends_on:
      - marquez
    ports:
      - "${MARQUEZ_WEB_HOST_PORT:-3000}:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: fs-jaeger
    command:
      - "--collector.otlp.enabled=true"
      - "--collector.otlp.http.host-port=0.0.0.0:4318"
      - "--collector.otlp.grpc.host-port=0.0.0.0:4317"
    ports:
      - "16686:16686"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fs-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - feature-group-service
      - feature-store-service
      - lineage-service
      - materialization-worker

  grafana:
    image: grafana/grafana:11.1.5
    container_name: fs-grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: fs-keycloak
    profiles: ["oidc"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "${KEYCLOAK_HOST_PORT:-8088}:8080"
